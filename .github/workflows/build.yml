name: Compilar APK Estrenos Cine

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar proyecto (acepta el zip sin descomprimir)
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            ZIP=$(ls -1 *.zip | head -n 1)
            unzip -q -o "$ZIP" -d _proyecto
            SUB=$(dirname "$(find _proyecto -name settings.gradle.kts | head -n 1)")
            echo "PROJECT_DIR=$SUB" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon -PTMDB_KEY="${{ secrets.TMDB_API_KEY }}"

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Estrenos-Cine-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
